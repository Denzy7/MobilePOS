plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.kapt'
}


def keystorePropertiesFile = rootProject.file("signing.properties")
def keystoreProperties = new Properties()
def isSigningConfigAvailable = false

if (keystorePropertiesFile.exists()) {
    try {
        keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
        isSigningConfigAvailable = keystoreProperties.containsKey('storeFile') &&
                                   keystoreProperties.containsKey('storePassword') &&
                                   keystoreProperties.containsKey('keyAlias') &&
                                   keystoreProperties.containsKey('keyPassword')
    } catch (Exception e) {
        println("Warning: Could not load signing.properties. Proceeding unsigned.")
    }
} else {
    println("Warning: signing.properties file not found. Proceeding unsigned.")
}

android {
    namespace 'com.denzygames.mobilepos'
    compileSdk 33

    signingConfigs {
        if (isSigningConfigAvailable) {
            release {
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }

    defaultConfig {
        applicationId "com.denzygames.mobilepos"
        minSdk 21
        targetSdk 33
        versionCode 1
        versionName "1.0"

//        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    splits.abi {
        enable true
            reset()

            include "x86", "x86_64", "armeabi-v7a", "arm64-v8a"
            universalApk true
    }

    buildTypes {
        release {
            if (isSigningConfigAvailable) {
                signingConfig signingConfigs.release
            } else {
                println("Warning: Release build will not be signed.")
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }

    buildFeatures {
        viewBinding true
    }

    kapt {
        arguments {
            arg("room.schemaLocation", "$projectDir/schemas")
        }
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.7.0'
    implementation 'androidx.appcompat:appcompat:1.5.1'
    implementation 'com.google.android.material:material:1.7.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
//    testImplementation 'junit:junit:4.13.2'
//    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
//    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'

    /* ROOM - Better SQLite */
    def room_version = "2.4.3"
    implementation "androidx.room:room-runtime:$room_version"
    annotationProcessor "androidx.room:room-compiler:$room_version"
    // To use Kotlin annotation processing tool (kapt)
    kapt("androidx.room:room-compiler:$room_version")

    /* CameraX + MLKit for Barcode scanning*/
    def camerax_version = "1.2.0-rc01"
    implementation "androidx.camera:camera-core:${camerax_version}"
    implementation "androidx.camera:camera-camera2:${camerax_version}"
    implementation "androidx.camera:camera-lifecycle:${camerax_version}"
    implementation "androidx.camera:camera-view:${camerax_version}"
    implementation 'androidx.camera:camera-mlkit-vision:1.2.0-beta02'
    implementation 'com.google.mlkit:barcode-scanning:17.0.2'

    /* activity & fragment for Activity Result API  */
    def activity_version = "1.6.1"
    def fragment_version = "1.5.5"
    implementation "androidx.activity:activity-ktx:${activity_version}"
    implementation "androidx.fragment:fragment-ktx:${fragment_version}"
}
